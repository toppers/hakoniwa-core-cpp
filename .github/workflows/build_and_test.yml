name: Hakoniwa-core-cpp
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - uses: actions/checkout@v4

      - name: Install deps (gtest)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgtest-dev
          sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build
          sudo cmake --build /usr/src/googletest/build
          sudo cmake --install /usr/src/googletest/build

      - name: Install deps (gtest, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install gtest:x64-windows

      - name: Build and Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./build.bash test
          cat cmake-build/Testing/Temporary/LastTest.log

      - name: Build and Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B cmake-build -Dtest=true -Ddebug=true -Dgcov=false `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build cmake-build --config Debug
          ctest --test-dir cmake-build -C Debug --output-on-failure
